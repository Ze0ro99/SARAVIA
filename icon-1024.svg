<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shape (1024x1024) -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGrad)"/>
  <rect width="1008" height="1008" x="8" y="8" rx="192" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.45"/>

  <!-- Celestial Compass Outer Rings -->
  <circle cx="512" cy="512" r="370" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="20 16" opacity="0.6"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35"/>

  <!-- Cardinal Compass Markers -->
  <path d="M512 160 L524 210 L512 230 L500 210 Z" fill="url(#goldGrad)"/>
  <path d="M512 864 L524 814 L512 794 L500 814 Z" fill="url(#goldGrad)"/>
  <path d="M160 512 L210 524 L230 512 L210 500 Z" fill="url(#goldGrad)"/>
  <path d="M864 512 L814 524 L794 512 L814 500 Z" fill="url(#goldGrad)"/>

  <!-- Falcon Crest of Aviation, Travel & Luxury Logistics -->
  <g filter="url(#goldGlow)">
    <path d="M512 280 C640 360 780 400 840 440 C720 460 620 480 512 540 C404 480 304 460 184 440 C244 400 384 360 512 280 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <polygon points="512,340 632,512 512,720 392,512" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
    <!-- Pi Royal Monogram S -->
    <path d="M450 440 Q512 390 570 440 Q570 490 512 520 Q450 550 450 600 Q512 650 574 600" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="750" r="14" fill="url(#cyanGrad)"/>
  </g>
</svg>
